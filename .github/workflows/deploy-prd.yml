name: PRD Promotion

on:
  push:
    branches:
      - main

concurrency:
  group: prd-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  promote-to-production:
    name: Promote Approved Digest to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Identify Merged PR and Image Tag
        id: pr_info
        uses: actions/github-script@v7
        with:
          script: |
            let pr = null;

            // 1. Extrair número da PR da mensagem de commit (Merge commit ou Squash merge)
            const commitMsg = context.payload.head_commit?.message || "";
            console.log(`Commit no push da main: "${commitMsg.split('\n')[0]}"`);

            const prMatch = commitMsg.match(/(?:merge pull request #|#)(\d+)/i);
            if (prMatch && prMatch[1]) {
              const prNumber = parseInt(prMatch[1], 10);
              console.log(`Identificado número de PR #${prNumber} a partir da mensagem de commit.`);
              try {
                const res = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber
                });
                if (res && res.data) {
                  pr = res.data;
                  console.log(`PR #${pr.number} obtida com sucesso via API direta.`);
                }
              } catch (err) {
                console.warn(`Aviso ao buscar PR #${prNumber} diretamente:`, err.message);
              }
            }

            // 2. Se não encontrou pela mensagem, buscar nas PRs recentemente fechadas / mergeadas na main
            if (!pr) {
              console.log("Buscando PRs recentemente fechadas na branch main...");
              try {
                const closedPrs = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'closed',
                  base: 'main',
                  sort: 'updated',
                  direction: 'desc',
                  per_page: 10
                });
                pr = closedPrs.data.find(p => p.merge_commit_sha === context.sha || p.head.sha === context.sha);
                if (!pr && closedPrs.data.length > 0) {
                  const latestMerged = closedPrs.data.find(p => p.merged_at);
                  if (latestMerged) {
                    console.log(`Usando PR recentemente mergeada #${latestMerged.number} como referência.`);
                    pr = latestMerged;
                  }
                }
              } catch (err) {
                console.warn("Aviso ao listar PRs fechadas:", err.message);
              }
            }

            // 3. Fallback: tentar endpoint de commit associations com retry
            if (!pr) {
              console.log("Tentando endpoint listPullRequestsAssociatedWithCommit com retry...");
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    commit_sha: context.sha
                  });
                  if (prs.data && prs.data.length > 0) {
                    pr = prs.data[0];
                    break;
                  }
                } catch (err) {
                  console.warn(`Tentativa ${attempt} falhou (${err.message}).`);
                  if (attempt < 3) await new Promise(r => setTimeout(r, 2000));
                }
              }
            }

            if (!pr) {
              core.setFailed("❌ DEPLOY BLOQUEADO: Nenhuma PR associada foi encontrada para este commit na main. É obrigatório homologar via PR antes de promover para Produção.");
              return;
            }

            console.log(`PR Confirmada: #${pr.number} (Head SHA: ${pr.head.sha})`);

            // Validar se o commit da PR foi homologado com sucesso em HML
            let hmlCheck = null;
            try {
              const statuses = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha
              });
              hmlCheck = statuses.data.statuses.find(s => s.context === 'hml/active-deployment');
            } catch (err) {
              console.warn("Aviso ao buscar combined status de HML:", err.message);
            }

            if (!hmlCheck || hmlCheck.state !== 'success') {
              core.setFailed(`❌ DEPLOY BLOQUEADO: A PR #${pr.number} não possui o status 'hml/active-deployment' com sucesso em HML! Homologação obrigatória antes de entrar em Produção.`);
              return;
            }

            console.log("✅ Homologação prévia confirmada:", hmlCheck.description);
            core.setOutput("pr_number", pr.number.toString());
            core.setOutput("image_tag", `pr-${pr.number}-${pr.head.sha}`);

      - name: Deploy Approved Container Image to VPS PRD
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            IMAGE_TAG="${{ steps.pr_info.outputs.image_tag }}"
            IMAGE_URI=$(echo "ghcr.io/${{ github.repository }}:${IMAGE_TAG}" | tr '[:upper:]' '[:lower:]')
            COMPOSE_DIR="/data/coolify/applications/compra-mais-frontend"
            COMPOSE_FILE="${COMPOSE_DIR}/docker-compose.yaml"
            BACKUP_FILE="${COMPOSE_DIR}/docker-compose.yaml.bak_$(date +%s)"
            
            echo "Efetuando backup do compose atual..."
            mkdir -p "$COMPOSE_DIR"
            if [ -f "$COMPOSE_FILE" ]; then
              cp "$COMPOSE_FILE" "$BACKUP_FILE"
            fi
            
            echo "Autenticando docker no GHCR e puxando imagem homologada ($IMAGE_URI)..."
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
            docker pull "$IMAGE_URI"
            
            echo "Atualizando compose de PRD para a nova imagem..."
            sed -i "s|image:.*compra-mais-frontend.*|image: '${IMAGE_URI}'|g" "$COMPOSE_FILE" || true
            
            echo "Recriando container de producao..."
            docker compose -f "$COMPOSE_FILE" up -d --no-deps compra-mais-frontend
            
            echo "Aguardando healthcheck de producao..."
            HEALTHY=false
            for i in {1..20}; do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' compra-mais-frontend 2>/dev/null || echo "starting")
              if [ "$STATUS" = "healthy" ]; then
                echo "Frontend de producao saudavel!"
                HEALTHY=true
                break
              fi
              echo "Tentativa $i: status = $STATUS. Aguardando 3s..."
              sleep 3
            done
            
            if [ "$HEALTHY" != "true" ]; then
              echo "ALERTA: Healthcheck falhou! Executando rollback automatico..."
              if [ -f "$BACKUP_FILE" ]; then
                cp "$BACKUP_FILE" "$COMPOSE_FILE"
                docker compose -f "$COMPOSE_FILE" up -d --no-deps compra-mais-frontend
              fi
              exit 1
            fi

      - name: Validate Production Health Endpoint
        run: |
          HEALTH_URL="https://compra-mais.vnmbholding.com"
          echo "Validando endpoint público de Produção: $HEALTH_URL..."
          sleep 5
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 307 ]; then
              echo "Producao validada com sucesso via Cloudflare (HTTP $STATUS)!"
              exit 0
            fi
            echo "Tentativa $i: HTTP $STATUS. Aguardando 5s..."
            sleep 5
          done
          echo "Aviso: Endpoint publico retornou HTTP $STATUS"
